site_name: treecf
site_description: Constrained, threshold-aware counterfactual explanations for tree ensembles.
site_url: https://wlazlod.github.io/treecf/
repo_url: https://github.com/wlazlod/treecf
repo_name: wlazlod/treecf

strict: true

exclude_docs: |
  README.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
  - mkdocs-jupyter:
      execute: false  # notebooks are committed executed; CI re-executes them separately

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      dedent_subsections: true
      check_paths: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Learn:
      - Install and quickstart: getting-started.md
      - How it works: how-it-works.md
      - "Tutorial: quickstart": notebooks/01-quickstart.ipynb
  - Guide:
      - Workflows:
          - Bring your model: guide/models.md
          - Set the target: guide/targets.md
          - Constrain the search: guide/constraints.md
          - Run the search: guide/explain.md
          - Certify and widen: guide/certify.md
          - Auditability: guide/auditability.md
          - Visualize: guide/visualize.md
      - Integrations:
          - probcal calibration: guide/probcal.md
          - Restricted environments: guide/no-solver.md
  - Concepts:
      - Foundations:
          - Models and the IR: concepts/models.md
          - Cells and category blocks: concepts/cells.md
          - Targets: concepts/targets.md
          - Missing values: concepts/missing-values.md
      - Search:
          - Backends and proofs: concepts/backends.md
          - Plausibility: concepts/plausibility.md
          - Coalitions: concepts/coalitions.md
      - Certification:
          - Certification: concepts/certification.md
          - Calibration: concepts/calibration.md
      - Constraints:
          - Constraints: concepts/constraints.md
      - Categorical:
          - Categorical features: concepts/categorical.md
  - Tutorials:
      - Credit-risk walkthrough: notebooks/02-credit-risk-tutorial.ipynb
      - No-solver environments: notebooks/03-no-solver-environments.ipynb
  - Benchmarks:
      - Comparison: benchmarks/comparison.md
  - API reference:
      - Overview: api.md
      - Explainer and results: api/explainer.md
      - Constraints: api/constraints.md
      - Targets: api/targets.md
      - Visualization: api/viz.md
      - API stability: api-stability.md
  - FAQ: faq.md
  - Changelog: changelog.md
