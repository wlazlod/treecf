name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev environment
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Docs snippet and structure tests
        if: matrix.python-version == '3.12'
        run: uv run pytest -m slow tests/test_docs_snippets.py tests/test_docs_structure.py

  conformance:
    name: conformance ${{ matrix.library }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library:
          # xgboost 3.1's DataFrame detection predates pandas 3.0's module
          # layout (fixed in 3.2), so that leg pairs the last compatible pandas
          - "xgboost==3.1.* 'pandas<3'"
          - "xgboost==3.2.*"
          # lightgbm 4.5's sklearn wrapper predates scikit-learn 1.7's API cleanup
          - "lightgbm==4.5.* scikit-learn==1.6.*"
          - "lightgbm==4.6.*"
          - "catboost==1.2.*"
          - "scikit-learn==1.6.*"
          - "scikit-learn==1.7.*"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --all-extras --dev

      - name: Pin library under test
        run: uv pip install ${{ matrix.library }}

      - name: Run IR conformance suite
        run: uv run pytest tests/ir/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --check --manifest-path rust/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-features --manifest-path rust/Cargo.toml -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path rust/Cargo.toml

  msrv:
    name: rust MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.86

      # featureless deliberately: the python/extension features need a
      # libpython at build time and are covered on stable above; the
      # featureless crate is what defines the MSRV surface
      - name: Test on MSRV
        run: cargo test --manifest-path rust/Cargo.toml

  probcal-matrix:
    name: probcal matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev environment
        run: uv sync --all-extras --dev

      - name: Pin probcal and lightgbm under test
        run: uv pip install "probcal==0.2.*" "lightgbm==4.6.*"

      - name: Run calibration matrix and plateau suites
        run: uv run pytest tests/test_probcal_matrix.py tests/exactness/test_calibrated_plateaus.py tests/test_audit_calibrated.py
