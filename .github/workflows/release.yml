name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

jobs:
  version-consistency:
    # a missed version location fails the release before any wheel is built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/test_version_everywhere.py

  wheels:
    name: wheel ${{ matrix.platform.name }}
    needs: [version-consistency]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # manylinux is the maturin-action input (picks the build container);
          # empty on macOS/Windows where it does not apply.
          # smoke: native = venv on the runner; alpine = docker container (the
          # musl wheel cannot install on the glibc runner directly); skip = the
          # cross-compiled targets the runner cannot execute at all
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, smoke: native }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: auto, smoke: skip }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, smoke: alpine }
          - { name: macos-arm64, runner: macos-14, target: aarch64, smoke: native }
          # macos-13 (last x86_64 runner) is retired; cross-compile on arm64
          - { name: macos-x86_64, runner: macos-14, target: x86_64, smoke: skip }
          - { name: windows-x86_64, runner: windows-latest, target: x64, smoke: native }
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist

      - uses: actions/setup-python@v7
        if: matrix.platform.smoke == 'native'
        with:
          python-version: "3.12"

      - name: Smoke-test wheel
        if: matrix.platform.smoke == 'native'
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ -x smoke-venv/bin/python ]; then PY=smoke-venv/bin/python; else PY=smoke-venv/Scripts/python.exe; fi
          "$PY" -m pip install numpy dist/*.whl
          "$PY" scripts/smoke_wheel.py

      - name: Smoke-test wheel (musllinux, via Alpine container)
        if: matrix.platform.smoke == 'alpine'
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.12-alpine \
            sh -c "pip install numpy dist/*.whl && python scripts/smoke_wheel.py"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform.name }}
          path: dist/

  sdist:
    name: sdist
    needs: [version-consistency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/treecf
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/treecf
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
